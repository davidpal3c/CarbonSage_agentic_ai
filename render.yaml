# CarbonSage public API blueprint.
# The web service is free. The production database is an external Neon
# PostgreSQL project; its connection string is entered in Render, never here.
# No credentials or deploy hooks belong in this file.
services:
  - type: web
    name: carbonsage-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: nzeroesg-api/Dockerfile
    dockerContext: nzeroesg-api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ASSISTANT_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openai/gpt-3.5-turbo-16k
      - key: CORS_ORIGINS
        value: https://n-zero-esg-scope3.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: DEMO_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ARTIFACT_STORAGE_ENABLED
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_REGION
        value: ca-central-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
