services:
  database:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: nzeroesg-database
    environment:
      POSTGRES_DB: nzeroesg
      POSTGRES_USER: nzeroesg
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nzeroesg -d nzeroesg"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./nzeroesg-api
    container_name: nzeroesg-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      ASSISTANT_ENABLED: "false"
      DATABASE_URL: postgresql://nzeroesg@database:5432/nzeroesg
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./nzeroesg-client
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    container_name: nzeroesg-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
