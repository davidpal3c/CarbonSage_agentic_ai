name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: python scripts/check_secrets.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: nzeroesg_test
          POSTGRES_USER: nzeroesg
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nzeroesg -d nzeroesg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: nzeroesg-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: nzeroesg-api/requirements*.txt
      - name: Configure disposable database
        run: echo "DATABASE_URL=postgresql://nzeroesg@localhost:5432/nzeroesg_test" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nzeroesg-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: nzeroesg-client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: nzeroesg_test
          POSTGRES_USER: nzeroesg
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nzeroesg -d nzeroesg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: nzeroesg-client/package-lock.json
      - name: Install backend dependencies
        working-directory: nzeroesg-api
        run: pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: nzeroesg-client
        run: npm ci
      - name: Install Chromium
        working-directory: nzeroesg-client
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke suite
        working-directory: nzeroesg-client
        env:
          CI: true
          E2E_PYTHON: python
          E2E_DATABASE_URL: postgresql://nzeroesg@localhost:5432/nzeroesg_test
        run: npm run test:e2e
